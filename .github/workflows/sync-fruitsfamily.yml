name: Sync FruitsFamily listings

on:
  schedule:
    # Every ~15 minutes, but deliberately off the :00/:15/:30/:45 marks. GitHub
    # delays or drops scheduled runs when load is high, and those marks are the
    # busiest; the */15 form produced no scheduled run at all for hours.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call sync endpoint
        run: |
          curl -sS --fail-with-body --max-time 120 --retry 2 -X POST https://tokyo-collective.vercel.app/api/admin/sync-fruitsfamily \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
